<section class="welcome">
  <header class="welcome-header">
    <h1>Banco de pruebas IoT</h1>
    <p>
      Recolección, almacenamiento y visualización de los parámetros que envían los dispositivos físicos durante sus pruebas.
      Las lecturas llegan por MQTT, se guardan en PostgreSQL y se consultan desde estos módulos.
    </p>
  </header>

  <div class="welcome-grid">
    <a class="welcome-card" *ngFor="let module of modules" [routerLink]="module.route">
      <h2>{{ module.title }}</h2>
      <p>{{ module.description }}</p>
    </a>
  </div>
</section>
